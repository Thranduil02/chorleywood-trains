<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metroland</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metroland">
<meta name="theme-color" content="#F3F0E8">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F3F0E8;color:#14161A;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1.serif,.tabs a,.link span{font-family:"New York",ui-serif,Georgia,"Times New Roman",serif}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5A5F66}
a{color:inherit}
button,input{font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:#5A5F66}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.live{background:#DCE9F7;color:#0E3560}
.pill.off{background:#FFF1E6;color:#A33A00}
.pill.tt{background:#E9E5DA;color:#3E434A}
.tabs{display:flex;background:#E4DFD2;border-radius:14px;padding:4px;gap:4px}
.tabs a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;color:#3E434A}
.tabs a[aria-current=page]{background:#fff;font-weight:700;color:#14161A}
.banner{background:#FFF1E6;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;color:#6B2800}
.note{background:#E4DFD2;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;color:#14161A}
.card{background:#fff;border:1px solid #E1DCCE;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff}
.tag.ch{background:#123B6D}.tag.met{background:#9B0058}
.big{font-size:46px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.mid{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.lbl{font-size:12px;color:#5A5F66}
.sub{font-size:13px;color:#5A5F66;margin-top:2px}
.chip{align-self:flex-start;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px}
.chip.late{background:#FFF1E6;color:#A33A00}
.chip.ok{background:#E9E5DA;color:#3E434A}
.chip.good{background:#DDF1E2;color:#14672E}
.chip.bad{background:#FBE0DD;color:#A3201A}
.chip.can{background:#A33A00;color:#fff}
.next{border-top:1px solid #ECE8DE;padding-top:12px;font-size:14px;color:#3E434A;display:flex;align-items:center;justify-content:space-between;gap:8px}
.next b{color:#14161A}
.tube{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #ECE8DE}
.tube .tc{min-width:92px;display:flex;flex-direction:column;gap:2px}
.tube .t{font-size:30px;font-weight:700;letter-spacing:-.03em}
.tube .m{flex:1;display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.tube .r{text-align:right}
.tube .a{font-size:24px;font-weight:600;letter-spacing:-.02em}
.ty{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.ty.fast{background:#14161A;color:#fff}
.ty.semi{border:1.5px solid #14161A;color:#14161A;padding:1.5px 8px}
.ty.normal{background:#E9E5DA;color:#3E434A}
.small{font-size:12px;color:#4A4F56}
.sub.late,.small.late{color:#A33A00;font-weight:600}
.link{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#E4DFD2;border-radius:14px;text-decoration:none;font-size:14px;font-weight:600}
.menu{background:#fff;border:1px solid #ECE8DE;border-radius:14px;margin:-4px 0 10px;overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid #ECE8DE;background:none;font:inherit;font-size:15px;font-weight:600;color:#14161A;cursor:pointer;text-align:left}
.opt:first-child{border-top:0}
.opt.on{background:#F3F0E7}
.btn{min-height:52px;border:0;border-radius:14px;background:#123B6D;color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:#E4DFD2;color:#14161A;min-height:44px;font-size:15px}
.btn[disabled]{opacity:.6}
.list{background:#fff;border:1px solid #E1DCCE;border-radius:16px;padding:4px 16px;display:flex;flex-direction:column}
.list h2{margin:12px 0 4px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #ECE8DE}
.li .n{font-size:15px;font-weight:600}
.li .d{font-size:13px;color:#5A5F66}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
input{width:100%;min-height:44px;border:1px solid #CFC9B8;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;color:#14161A}
.field{padding:10px 0;border-top:1px solid #ECE8DE}
details{background:#fff;border:1px solid #E1DCCE;border-radius:16px;padding:12px 16px}
summary{font-size:15px;font-weight:600;min-height:28px;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;margin:8px 0 0;color:#3E434A}
.back{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;text-decoration:none;align-self:flex-start}
.empty{font-size:14px;line-height:1.5;color:#3E434A}
</style>
</head>
<body>
<div id="app" class="app"></div>
<noscript>This app needs JavaScript.</noscript>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
